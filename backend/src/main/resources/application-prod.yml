app:
  audit:
    personal-data-days: ${AUDIT_PERSONAL_DATA_DAYS}
    retention-days: ${AUDIT_RETENTION_DAYS}
    maintenance:
      username: ${DB_AUDIT_MAINTENANCE_ROLE}
      password: ${DB_AUDIT_MAINTENANCE_PASSWORD}
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    refresh-cookie-secure: true
    email-verification-required: true
  mail:
    delivery: smtp
  rate-limit:
    store: redis
  storage:
    type: s3
    s3:
      bucket: ${S3_BUCKET}
      permanent-delete-versions: true

server:
  forward-headers-strategy: framework

spring:
  datasource:
    username: ${DB_RUNTIME_ROLE}
    password: ${DB_RUNTIME_PASSWORD}
  flyway:
    user: ${DB_MIGRATION_ROLE}
    password: ${DB_MIGRATION_PASSWORD}
    placeholders:
      runtimeRole: ${DB_RUNTIME_ROLE}
      auditMaintenanceRole: ${DB_AUDIT_MAINTENANCE_ROLE}
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
            required: ${SMTP_STARTTLS_REQUIRED:true}

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db,redis,objectStorage,validator,dataLifecycle
  health:
    redis:
      enabled: true

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: ${APP_RELEASE:unknown}
        environment: ${APP_ENVIRONMENT:staging}
    json:
      stacktrace:
        max-length: 8192
        max-throwable-depth: 40

sentry:
  dsn: ${SENTRY_DSN}
  environment: ${APP_ENVIRONMENT}
  release: ${APP_RELEASE}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}

# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      # noinspection UndefinedAction
      - uses: actions/checkout@v6

      # noinspection UndefinedAction
      - uses: actions/setup-java@v5
        # noinspection UndefinedParamsPresent
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # noinspection UndefinedAction
      - uses: actions/setup-python@v6
        # noinspection UndefinedParamsPresent
        with:
          python-version: "3.12"

      - name: Install FA(3) validator
        run: python -m pip install lxml==6.1.0

      - name: Test backend
        working-directory: backend
        run: mvn --batch-mode verify -Dxml.validator.command=python

  frontend:
    runs-on: ubuntu-latest
    steps:
      # noinspection UndefinedAction
      - uses: actions/checkout@v6

      # noinspection UndefinedAction
      - uses: actions/setup-node@v6
        # noinspection UndefinedParamsPresent
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  staging-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate staging compose
        run: docker compose --env-file .env.staging.example -f compose.staging.yml config --quiet

      - name: Build production containers
        run: |
          docker build backend
          docker build --build-arg VITE_API_URL=/api frontend
          docker build infrastructure/postgres
          docker build infrastructure/caddy
          docker build infrastructure/alertmanager

      - name: Start disposable staging stack
        run: docker compose --profile smoke --env-file infrastructure/smoke.env -f compose.staging.yml up -d --build --wait

      - name: Run staging smoke tests
        env:
          SMOKE_RESOLVE: staging.test:80:127.0.0.1
          SMOKE_CORS_ORIGIN: http://frontend.staging.test
        run: sh scripts/staging-smoke.sh http://staging.test

      - name: Show staging logs on failure
        if: failure()
        run: docker compose --profile smoke --env-file infrastructure/smoke.env -f compose.staging.yml logs

      - name: Stop disposable staging stack
        if: always()
        run: docker compose --profile smoke --env-file infrastructure/smoke.env -f compose.staging.yml down --volumes
